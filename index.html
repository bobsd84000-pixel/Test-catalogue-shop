<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie 50 Bagues & Bijoux Fantaisies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0f0f0f;
            --bg-light: #faf8f3;
            --text-dark: #e0e0e0;
            --text-light: #1a1a1a;
            --card-dark: #1a1a1a;
            --card-light: #fff;
            --border-dark: #333;
            --border-light: #e0e0e0;
            --accent: #d4af37;
        }

        html.light-mode {
            --bg: var(--bg-light);
            --text: var(--text-light);
            --card: var(--card-light);
            --border: var(--border-light);
        }

        html.dark-mode {
            --bg: var(--bg-dark);
            --text: var(--text-dark);
            --card: var(--card-dark);
            --border: var(--border-dark);
        }

        body {
            font-family: 'Georgia', serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.95em;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--card);
            border-color: var(--accent);
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 16px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 12px;
        }

        .card-category {
            font-size: 0.75em;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .card-name {
            font-size: 1em;
            font-weight: 500;
            margin: 8px 0;
            min-height: 40px;
        }

        .card-price {
            font-size: 1.1em;
            color: var(--accent);
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--card);
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .modal-info {
            padding: 20px;
        }

        .modal-name {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .modal-price {
            font-size: 1.3em;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            color: var(--text);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1001;
        }

        .close-btn:hover {
            color: var(--accent);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }
            .card-image {
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Galerie Bijoux</h1>
        <p class="subtitle">50 Bagues & Bijoux Fantaisies</p>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Sombre</button>
    </header>

    <div class="filter-buttons">

        <button class="filter-btn" onclick="filterGallery('colliers')">Colliers</button>
        <button class="filter-btn" onclick="filterGallery('bracelets')">Bracelets</button>
    </div>

        let currentFilter = 'all';

        function initGallery() {
            renderGallery();
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            const filtered = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category === currentFilter);

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img class="card-image" src="${product.image}" alt="${product.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23333%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2214%22%3EImage indisponible%3C/text%3E%3C/svg%3E'">
                    <div class="card-info">
                        <div class="card-category">${product.category}</div>
                        <div class="card-name">${product.name}</div>
                        <div class="card-price">${product.price}</div>
                    </div>
                `;
                card.onclick = () => openModal(product);
                gallery.appendChild(card);
            });
        }

        function filterGallery(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGallery();
        }

        function openModal(product) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-image').src = product.image;
            document.getElementById('modal-name').textContent = product.name;
            document.getElementById('modal-price').textContent = product.price;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark-mode');
            html.classList.remove(isDark ? 'dark-mode' : 'light-mode');
            html.classList.add(isDark ? 'light-mode' : 'dark-mode');
            document.querySelector('.theme-toggle').textContent = isDark ? '🌙 Sombre' : '☀️ Clair';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Charger thème sauvegardé
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') toggleTheme();

        initGallery();
    </script>
</body>
</html>
